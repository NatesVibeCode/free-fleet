[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-fleet"
version = "0.2.4"
description = "Harness and worker fleet for free and local LLM batch processing with exact source evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NatesVibeCode" }]
requires-python = ">=3.10"
keywords = ["mcp", "agent-skills", "sqlite", "structured-output", "evidence-grounding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.20.0",
    "httpx>=0.24.0",
    "mcp>=1.26.0,<2",
]

[project.urls]
Homepage = "https://github.com/NatesVibeCode/free-fleet"
Repository = "https://github.com/NatesVibeCode/free-fleet"
Issues = "https://github.com/NatesVibeCode/free-fleet/issues"
Security = "https://github.com/NatesVibeCode/free-fleet/security/policy"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
discover = [
    "ddgs>=8.0",
    "readability-lxml>=0.8",
    "trafilatura>=1.0",
    "pypdf>=4.0",
]
js = [
    "playwright>=1.40",
]

[project.scripts]
free-fleet = "free_fleet.cli:main"
bulk-lanes = "free_fleet.cli:main"  # deprecated shim, emits warning and will be removed in 0.3.0

[tool.setuptools.packages.find]
include = ["free_fleet*"]

[tool.setuptools.package-data]
free_fleet = [
    "migrations/*.sql",
    "data/*.json",
    "resources/skill/*.md",
    "resources/skill/references/*.md",
    "resources/skill/agents/*.yaml",
]

[tool.setuptools.data-files]
"share/free-fleet/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
