[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-fleet"
version = "0.3.0"
description = "Coordinate any CLI-harness worker fleet with closed fields and exact quote verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NatesVibeCode" }]
requires-python = ">=3.10"
keywords = ["mcp", "agent-skills", "sqlite", "structured-output", "evidence-grounding", "prospecting", "account-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.20.0",
    "httpx>=0.24.0",
    "mcp>=1.26.0,<2",
]

[project.urls]
Homepage = "https://github.com/NatesVibeCode/harness-fleet"
Repository = "https://github.com/NatesVibeCode/harness-fleet"
Issues = "https://github.com/NatesVibeCode/harness-fleet/issues"
Security = "https://github.com/NatesVibeCode/harness-fleet/security/policy"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
discover = [
    "ddgs>=8.0",
    "readability-lxml>=0.8",
    "trafilatura>=1.0",
    "pypdf>=4.0",
]
js = [
    "playwright>=1.40",
]

[project.scripts]
harness-fleet = "harness_fleet.cli:main"

[tool.setuptools.packages.find]
include = ["harness_fleet*"]

[tool.setuptools.package-data]
harness_fleet = [
    "migrations/*.sql",
    "data/*.json",
    "resources/harness_skill/*.md",
    "resources/harness_skill/references/*.md",
    "resources/harness_skill/agents/*.yaml",
    "resources/account_skill/*.md",
    "resources/account_skill/references/*.md",
    "resources/examples/account_research/*.json",
    "resources/examples/account_research/*.csv",
]

[tool.setuptools.data-files]
"share/harness-fleet/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "PLR0124"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "harness_fleet.providers.*",
    "harness_fleet.cli",
    "harness_fleet.mcp_server",
    "harness_fleet.setup",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["ddgs.*", "pdfminer.*", "pypdf", "jsonschema"]
ignore_missing_imports = true

# calibrate's nested-sweep nonlocal bindings are runtime-proven (the module
# compiles, so the bindings exist); mypy's scope analysis false-positives
# here, and inline ignores are invalid on nonlocal statements.
[[tool.mypy.overrides]]
module = "harness_fleet.calibrate"
disable_error_code = ["misc"]
